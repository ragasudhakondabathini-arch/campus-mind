<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Mind – Faculty Login</title>
  <link rel="stylesheet" href="/ui/shared.css">
  <style>
    body {
      background: linear-gradient(135deg, #1E1B4B 0%, #2D286B 50%, #4338CA 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo {
      width: 56px;
      height: 56px;
      background: var(--primary);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: var(--shadow-primary);
    }
    .login-header h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .login-header p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .quick-creds {
      background: var(--surface-2);
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="login-logo">🎓</div>
    <h2>Faculty Portal</h2>
    <p>Sign in to manage Wi-Fi classroom attendance</p>
  </div>

  <form id="login-form">
    <div class="form-group">
      <label class="form-label">Faculty ID <span class="req">*</span></label>
      <div class="form-input-wrap">
        <span class="form-input-icon">👤</span>
        <input type="text" id="faculty-id" class="form-control" placeholder="Enter Faculty ID" required autofocus value="">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Password <span class="req">*</span></label>
      <div class="form-input-wrap">
        <span class="form-input-icon">🔒</span>
        <input type="password" id="password" class="form-control" placeholder="Enter Password" required value="">
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn" style="margin-top: 10px;">
      Sign In to Dashboard →
    </button>
  </form>

  <div style="text-align: center; margin-top: 24px; font-size: 0.82rem; color: var(--text-muted);">
    Are you a student? <a href="/student" style="color: var(--primary); font-weight: 700; text-decoration: none;">Join Session Here</a>
  </div>
</div>

<div class="toast-box" id="toast-box"></div>

<script>
  function toast(msg, isError = false) {
    const box = document.getElementById('toast-box');
    const t = document.createElement('div');
    t.className = 'toast ' + (isError ? 'error' : 'success');
    t.innerText = msg;
    box.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerText = 'Signing in…';

    const faculty_id = document.getElementById('faculty-id').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ faculty_id, password })
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.detail || 'Sign-in failed');
      }
      localStorage.setItem('faculty_token', data.token);
      localStorage.setItem('faculty_name', data.name);
      localStorage.setItem('faculty_id', data.faculty_id);
      toast('Signed in successfully! Redirecting…');
      setTimeout(() => {
        window.location.href = '/faculty';
      }, 700);
    } catch (err) {
      toast(err.message, true);
      btn.disabled = false;
      btn.innerText = 'Sign In to Dashboard →';
    }
  });
</script>
</body>
</html>
